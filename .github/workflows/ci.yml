name: Playground compiler and guest tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-wasm-execution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install WebAssembly linker
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Check exact checkout and compiler tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          node --version
          clang --version
      - name: Build actual compiler Wasm and run guest fixtures
        run: npm run verify
      - name: Browser E2E smoke (real headless Chromium)
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          npm run test:browser
          npm run test:e2e
      - name: Record tested compiler artifact and toolchain
        run: |
          sha256sum public/atto_compiler.wasm
          node -e 'const fs = require("fs"); const wasm = fs.readFileSync("public/atto_compiler.wasm"); if (!WebAssembly.validate(wasm)) process.exit(1)'
          echo "Artifact was freshly built from the checked-out source; byte-identical cross-toolchain builds require a separately pinned Clang distribution."
