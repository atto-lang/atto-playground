name: Publish static AttoLang playground
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install wasm32 compiler dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Compile compiler and execute real Wasm guests
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          npm run verify
          sha256sum public/atto_compiler.wasm
      - name: Package static site
        run: |
          mkdir -p _site
          cp -R index.html styles.css src public docs _site/
          test -s _site/public/atto_compiler.wasm
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
