name: Publish approved AttoLang playground
# No automatic public disclosure of compiler Wasm from a private repository.
on:
  workflow_dispatch:
    inputs:
      expected_compiler_sha256:
        description: SHA-256 of reviewed public compiler binary
        required: true
        type: string
      confirm_public_disclosure:
        description: Explicit authorization to publish the compiler binary
        required: true
        type: choice
        options: ['no', 'yes']
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'atto-lang/atto-playground' && inputs.confirm_public_disclosure == 'yes'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify independent binary disclosure approval and exact commit
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          RELEASE_APPROVAL: ${{ vars.ATTO_PUBLIC_COMPILER_SHA256 }}
          REQUESTED_APPROVAL: ${{ inputs.expected_compiler_sha256 }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          case "$RELEASE_APPROVAL" in
            *[!0-9a-f]*|'') echo 'Missing or invalid release approval'; exit 1 ;;
          esac
          test "${#RELEASE_APPROVAL}" -eq 64
          test "$RELEASE_APPROVAL" = "$REQUESTED_APPROVAL"
          test "$RELEASE_APPROVAL" = "$(sha256sum public/atto_compiler.wasm | cut -d' ' -f1)"
      - name: Test compiler ABI, guests, and browser smoke
        run: |
          npm run verify
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          npm run test:browser
      - name: Stage strictly allowlisted binary release and mandatory source-to-actor Chromium E2E
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          APPROVED_COMPILER_SHA256: ${{ vars.ATTO_PUBLIC_COMPILER_SHA256 }}
          ATTO_REQUIRE_ACTOR_SOURCE_E2E: '1'
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node scripts/package-pages.mjs _site
          ATTO_STATIC_ROOT="$PWD/_site" npm run test:e2e
          test -s _site/release-manifest.json
          cmp public/atto_compiler.wasm _site/public/atto_compiler.wasm
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'atto-lang/atto-playground' && inputs.confirm_public_disclosure == 'yes'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
